<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Descargar Violin Beach Kombat v1.4</title>
<style>
  :root{
    --bg:#0b1420;
    --panel:#0f1c31;
    --accent:#1f7aec;
    --text:#e8f2ff;
  }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 20% 20%, rgba(66,135,245,0.12), transparent 40%),
               radial-gradient(circle at 80% 70%, rgba(255,190,120,0.1), transparent 45%),
               var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  .card{
    width:min(820px,94vw);
    background:var(--panel);
    border:1px solid #1f3050;
    border-radius:14px;
    padding:22px;
    box-shadow:0 20px 60px #000a, 0 0 0 1px #0c1727;
  }
  h1{margin:0 0 12px;font-size:22px;}
  p{margin:0 0 12px;line-height:1.5;color:#c8d9ff;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px;}
  input, button{
    font:600 14px system-ui;
  }
  input{
    flex:1 1 380px;
    min-width:260px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #1f3050;
    background:#0c1424;
    color:#d8e6ff;
  }
  button{
    border:none;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .12s ease, opacity .15s;
  }
  .primary{
    background:linear-gradient(135deg,#1f7aec,#10b2ff);
    color:#fff;
    box-shadow:0 10px 24px #0008;
  }
  .primary:hover{transform:translateY(-2px);}
  .danger{
    background:#2a1212;
    color:#f7c5c5;
    border:1px solid #5b2020;
  }
  small{color:#9bb3d7;}
</style>
</head>
<body>
  <div class="card">
    <h1>Descargar Violin Beach Kombat (v1.4)</h1>
    <p>Presiona descargar para bajar directamente desde GitHub (link RAW). Si falla, revisa que el enlace sea público y correcto.</p>
    <div class="row">
      <input type="url" id="urlInput" value="https://raw.githubusercontent.com/FranciscoAraya04/Violin-Games-/refs/heads/main/ViolinBeachKombat/Violin_Beach_Kombat%28v1.4%29.html" />
      <button class="primary" id="btnDownload">Descargar HTML</button>
      <button class="danger" id="btnClear">Limpiar enlace</button>
    </div>
    <small id="status"></small>
  </div>

<script>
const urlInput = document.getElementById('urlInput');
const btnDownload = document.getElementById('btnDownload');
const btnClear = document.getElementById('btnClear');
const status = document.getElementById('status');

function setStatus(text, tone='info'){
  status.textContent = text || '';
  status.style.color = tone === 'error' ? '#ffb3b3' : '#9bb3d7';
}

function downloadBlob(text){
  const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Violin_Beach_Kombat(v1.4).html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function downloadFile(){
  const src = (urlInput.value || '').trim();
  if(!src){
    alert('Agrega el enlace RAW de GitHub.');
    return;
  }
  setStatus('Descargando...');
  try{
    const res = await fetch(src);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    downloadBlob(text);
    setStatus('Descarga lista.');
  }catch(err){
    setStatus('No se pudo descargar desde la URL. Verifica que sea RAW y público.', 'error');
    alert('No se pudo descargar desde la URL RAW.\n' + err);
  }
}

function clearLink(){
  urlInput.value = '';
  setStatus('');
}

btnDownload.addEventListener('click', downloadFile);
btnClear.addEventListener('click', clearLink);
</script>
</body>
</html>
